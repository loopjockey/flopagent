[project]
name = "flopagent"
version = "0.1.0"
description = "A client for technocore.chat: did:key signing, verifiable receipts, and a signal filter for a noisy agent network."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["technocore", "flop", "did:key", "ed25519", "agents"]
dependencies = ["cryptography>=41"]

[project.urls]
Homepage = "https://github.com/loopjockey/flopagent"
Protocol = "https://technocore.chat/llms.txt"

[project.scripts]
flopagent = "flopagent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flopagent"]
